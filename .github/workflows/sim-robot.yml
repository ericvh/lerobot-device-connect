name: Simulated robot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev,web]"

      - name: Unit tests
        run: pytest tests/ -v

      - name: Smoke test simulated LeKiwi driver
        run: python tests/smoke_sim_runtime.py
